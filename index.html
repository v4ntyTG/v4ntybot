<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="V4nty | Бот — официальные публикации и обновления."
  >

  <title>V4nty | Бот</title>

  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #16181d;
      --muted: #747984;
      --border: #e5e7eb;
      --accent: #2457ff;
      --accent-hover: #1747df;
      --danger: #d92d45;
      --radius: 18px;
      --small-radius: 11px;
      --max: 1080px;
      --shadow: 0 12px 36px rgba(20, 25, 35, .06);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.6;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    img {
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(
        calc(100% - 28px),
        var(--max)
      );

      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;

      height: 68px;

      background:
        rgba(245, 246, 248, .9);

      backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid var(--border);
    }

    .header-inner {
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      text-decoration: none;
    }

    .brand-logo {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--text);
      color: white;

      font-size: 17px;
      font-weight: 900;
    }

    .brand-name {
      font-weight: 800;
      font-size: 16px;
    }

    .brand-muted {
      color: var(--muted);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;

      font-size: 13px;
      font-weight: 700;
    }

    nav a:hover {
      color: var(--text);
    }

    .hero {
      padding: 80px 0 70px;
    }

    .eyebrow {
      color: var(--accent);

      font-size: 11px;
      font-weight: 900;

      text-transform: uppercase;
      letter-spacing: .13em;
    }

    .hero h1 {
      margin: 12px 0 15px;

      font-size:
        clamp(46px, 8vw, 76px);

      line-height: .95;
      letter-spacing: -.055em;
    }

    .hero p {
      max-width: 650px;

      margin: 0;

      color: var(--muted);

      font-size: 18px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;

      gap: 9px;

      margin-top: 28px;
    }

    .button {
      min-height: 44px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 0 16px;

      border:
        1px solid transparent;

      border-radius: 11px;

      font-size: 13px;
      font-weight: 800;

      text-decoration: none;

      transition: .15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      background: var(--accent);
      color: white;
    }

    .button-primary:hover {
      background: var(--accent-hover);
    }

    .button-secondary {
      background: var(--card);
      color: var(--text);

      border-color:
        var(--border);
    }

    .button-danger {
      background: var(--danger);
      color: white;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;

      gap: 20px;

      margin-bottom: 22px;
    }

    .section-head h2 {
      margin: 4px 0 0;

      font-size: 30px;
      letter-spacing: -.035em;
    }

    .search {
      width: 300px;
    }

    .search input,
    .field input,
    .field textarea {
      width: 100%;

      outline: none;

      border:
        1px solid var(--border);

      border-radius:
        var(--small-radius);

      background:
        var(--card);

      color:
        var(--text);
    }

    .search input,
    .field input {
      min-height: 44px;

      padding:
        0 13px;
    }

    .search input:focus,
    .field input:focus,
    .field textarea:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 4px
        rgba(36, 87, 255, .08);
    }

    .posts {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;
    }

    .post-card {
      overflow: hidden;

      background: var(--card);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);
    }

    .post-card-image {
      width: 100%;

      aspect-ratio: 16 / 9;

      display: block;

      object-fit: cover;
    }

    .post-card-body {
      padding: 22px;
    }

    .post-meta {
      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
    }

    .post-card h3 {
      margin: 8px 0;

      font-size: 22px;
      line-height: 1.15;

      letter-spacing: -.03em;
    }

    .post-excerpt {
      margin: 0;

      color: var(--muted);

      display: -webkit-box;

      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .post-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;

      margin-top: 18px;
    }

    .empty,
    .loading {
      padding: 55px 20px;

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      background: var(--card);

      color: var(--muted);

      text-align: center;
    }

    /* ARTICLE */

    .article-page {
      max-width: 840px;

      padding:
        45px 0
        80px;
    }

    .article-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .back {
      color: var(--muted);

      text-decoration: none;

      font-size: 13px;
      font-weight: 700;
    }

    .article-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 21px;
    }

    .article-title {
      margin:
        36px 0 28px;

      font-size:
        clamp(38px, 7vw, 62px);

      line-height: 1;

      letter-spacing: -.05em;
    }

    .article-image {
      margin: 0 0 28px;
    }

    .article-image img {
      width: 100%;

      max-height: 640px;

      object-fit: cover;

      display: block;

      border-radius:
        var(--radius);
    }

    .article-image figcaption {
      margin-top: 9px;

      color: var(--muted);

      text-align: center;

      font-size: 12px;
    }

    .content {
      font-size: 18px;
      line-height: 1.8;

      overflow-wrap: anywhere;
    }

    .content a {
      color: var(--accent);
    }

    .content code {
      padding: 2px 5px;

      border-radius: 6px;

      background: #eceef2;

      font-size: .88em;
    }

    .content pre {
      padding: 17px;

      overflow-x: auto;

      border-radius: 12px;

      background: #17191d;
      color: #f5f5f5;
    }

    .content pre code {
      padding: 0;
      background: none;
      color: inherit;
    }

    .content blockquote {
      margin: 18px 0;

      padding: 12px 18px;

      border-left:
        4px solid
        var(--accent);

      border-radius:
        0 10px
        10px 0;

      background: #fafbfc;

      color: #565b65;
    }

    .content tg-spoiler {
      padding:
        1px 5px;

      border-radius: 4px;

      background:
        var(--text);

      color: transparent;

      cursor: pointer;
    }

    .content tg-spoiler:hover {
      color: inherit;
    }

    /* ADMIN */

    .admin {
      padding:
        40px 0
        80px;
    }

    .auth-box {
      width: min(
        440px,
        100%
      );

      margin:
        55px auto;

      padding: 25px;

      background:
        var(--card);

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);
    }

    .auth-box h1 {
      margin: 6px 0;
    }

    .auth-box p {
      color: var(--muted);
    }

    .field {
      margin-top: 17px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 12px;
      font-weight: 800;
    }

    .field textarea {
      min-height: 330px;

      padding: 13px;

      resize: vertical;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size: 13px;

      line-height: 1.55;
    }

    .admin-layout {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        310px;

      gap: 18px;

      align-items: start;
    }

    .editor,
    .sidebar {
      background:
        var(--card);

      border:
        1px solid
        var(--border);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);
    }

    .editor {
      padding: 24px;
    }

    .sidebar {
      padding: 18px;

      position: sticky;
      top: 85px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;

      gap: 5px;

      margin-bottom: 8px;
    }

    .toolbar button {
      height: 33px;

      padding:
        0 9px;

      border:
        1px solid
        var(--border);

      border-radius: 8px;

      background:
        var(--card);

      font-size: 10px;
      font-weight: 900;
    }

    .toolbar button:hover {
      border-color:
        var(--accent);

      color:
        var(--accent);
    }

    .preview {
      margin-top: 20px;

      padding: 17px;

      background:
        #fafbfc;

      border:
        1px solid
        var(--border);

      border-radius:
        12px;
    }

    .preview-label {
      margin-bottom: 8px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 900;

      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .post-list {
      display: grid;

      gap: 8px;

      margin-top: 13px;
    }

    .post-item {
      padding: 12px;

      background:
        #fafbfc;

      border:
        1px solid
        var(--border);

      border-radius:
        10px;
    }

    .post-item-title {
      font-size: 13px;
      font-weight: 800;
    }

    .post-item-meta {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
    }

    .post-item-buttons {
      display: flex;
      flex-wrap: wrap;

      gap: 5px;

      margin-top: 9px;
    }

    .mini {
      min-height: 29px;

      padding:
        0 9px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        var(--border);

      border-radius: 8px;

      background:
        var(--card);

      color:
        var(--text);

      text-decoration: none;

      font-size: 10px;
      font-weight: 800;
    }

    .error {
      margin-top: 10px;

      padding: 10px;

      border-radius: 9px;

      background:
        rgba(217, 45, 69, .07);

      color:
        var(--danger);

      font-size: 12px;
    }

    footer {
      margin-top: 80px;

      padding:
        30px 0
        45px;

      border-top:
        1px solid
        var(--border);
    }

    .footer {
      display: flex;

      justify-content: space-between;

      gap: 25px;
    }

    .footer p {
      margin: 4px 0 0;

      color: var(--muted);

      font-size: 12px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;

      gap: 15px;
    }

    .footer-links a {
      color: var(--muted);

      text-decoration: none;

      font-size: 12px;
      font-weight: 700;
    }

    .toast {
      position: fixed;

      left: 50%;
      bottom: 20px;

      z-index: 1000;

      max-width:
        calc(100% - 30px);

      padding:
        11px 15px;

      border-radius:
        11px;

      background:
        #17191d;

      color:
        white;

      font-size: 12px;
      font-weight: 750;

      opacity: 0;

      transform:
        translate(-50%, 18px);

      pointer-events: none;

      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    @media (max-width: 800px) {
      .posts,
      .admin-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .section-head {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .search input {
        width: 100%;
      }

      .footer {
        flex-direction: column;
      }
    }

    @media (max-width: 580px) {
      nav a:nth-child(2),
      nav a:nth-child(3) {
        display: none;
      }

      .hero {
        padding-top: 50px;
      }

      .hero h1 {
        font-size: 50px;
      }

      .article-page {
        padding-top: 30px;
      }

      .article-title {
        margin-top: 27px;
      }

      .editor {
        padding: 18px;
      }
    }
  </style>
</head>

<script>
'use strict';

/*
  =========================================================
  СЮДА ВСТАВЛЯЕТСЯ URL ТВОЕГО TERMUX-СЕРВЕРА
  =========================================================

  Например:

  const API_URL =
    'https://abc123.localhost.run';

  Без / в конце.
*/
const API_URL =
  'https://dc9d36bb82d7fc.lhr.life';

const app =
  document.getElementById('app');

const toast =
  document.getElementById('toast');

let site = {
  isAdmin: false
};

let adminPosts = [];

function showToast(
  message
) {
  toast.textContent =
    message;

  toast.classList.add(
    'show'
  );

  clearTimeout(
    showToast.timer
  );

  showToast.timer =
    setTimeout(
      () => {
        toast.classList.remove(
          'show'
        );
      },
      2200
    );
}

function esc(
  value
) {
  return String(
    value ?? ''
  )
    .replaceAll(
      '&',
      '&amp;'
    )
    .replaceAll(
      '<',
      '&lt;'
    )
    .replaceAll(
      '>',
      '&gt;'
    )
    .replaceAll(
      '"',
      '&quot;'
    )
    .replaceAll(
      "'",
      '&#039;'
    );
}

function escAttr(
  value
) {
  return esc(value);
}

function date(
  value
) {
  const d =
    new Date(value);

  if (
    Number.isNaN(
      d.getTime()
    )
  ) {
    return '';
  }

  return new Intl.DateTimeFormat(
    'ru-RU',
    {
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }
  ).format(d);
}

function textFromHTML(
  html
) {
  const doc =
    new DOMParser()
      .parseFromString(
        html,
        'text/html'
      );

  return (
    doc.body.textContent || ''
  )
    .replace(
      /\s+/g,
      ' '
    )
    .trim();
}

function apiURL(
  path
) {
  return (
    API_URL.replace(
      /\/+$/,
      ''
    ) +
    path
  );
}

async function request(
  path,
  options = {}
) {
  const headers = {
    ...(options.headers || {})
  };

  const token =
    localStorage.getItem(
      'v4nty_admin_token'
    );

  if (token) {
    headers.Authorization =
      `Bearer ${token}`;
  }

  const response =
    await fetch(
      apiURL(path),
      {
        ...options,
        headers
      }
    );

  let data = null;

  try {
    data =
      await response.json();
  } catch {}

  if (!response.ok) {
    if (
      response.status === 401
    ) {
      localStorage.removeItem(
        'v4nty_admin_token'
      );

      site.isAdmin = false;
    }

    throw new Error(
      data?.error ||
      'Ошибка сервера.'
    );
  }

  return data;
}

function route() {
  const hash =
    location.hash ||
    '#/';

  if (
    hash.startsWith(
      '#/post/'
    )
  ) {
    return {
      type: 'post',
      slug: decodeURIComponent(
        hash.slice(7)
      )
    };
  }

  if (
    hash.startsWith(
      '#/admin'
    )
  ) {
    const index =
      hash.indexOf('?');

    const params =
      index === -1
        ? new URLSearchParams()
        : new URLSearchParams(
            hash.slice(
              index + 1
            )
          );

    return {
      type: 'admin',
      edit:
        params.get(
          'edit'
        )
    };
  }

  return {
    type: 'home'
  };
}

/* =========================
   HOME
========================= */

async function home() {
  app.innerHTML = `
    <div class="container loading">
      Загружаем публикации…
    </div>
  `;

  try {
    const data =
      await request(
        '/api/posts?limit=100'
      );

    renderHome(
      data.posts
    );
  } catch (error) {
    app.innerHTML = `
      <div class="container" style="padding-top:45px">
        <div class="empty">
          ${esc(error.message)}
        </div>
      </div>
    `;
  }
}

function renderHome(
  posts
) {
  const cards =
    posts
      .map(
        post => {
          const image =
            post.image_filename
              ? `
                <img
                  class="post-card-image"
                  src="${apiURL(
                    `/uploads/${encodeURIComponent(
                      post.image_filename
                    )}`
                  )}"
                  alt=""
                  loading="lazy"
                >
              `
              : '';

          return `
            <article class="post-card">

              ${image}

              <div class="post-card-body">

                <div class="post-meta">
                  ${date(
                    post.created_at
                  )}
                </div>

                <h3>
                  ${esc(
                    post.title
                  )}
                </h3>

                <p class="post-excerpt">
                  ${esc(
                    textFromHTML(
                      post.content_html
                    )
                  )}
                </p>

                <div class="post-actions">

                  <a
                    class="button button-primary"
                    href="#/post/${encodeURIComponent(
                      post.slug
                    )}"
                  >
                    Читать
                  </a>

                  <button
                    class="button button-secondary"
                    onclick="copyPost('${escAttr(
                      post.slug
                    )}')"
                  >
                    Копировать ссылку
                  </button>

                </div>

              </div>

            </article>
          `;
        }
      )
      .join('');

  app.innerHTML = `
    <section class="container hero">

      <div class="eyebrow">
        Официальная площадка
      </div>

      <h1>
        V4nty | Бот
      </h1>

      <p>
        Публикации, обновления и важная информация
        проекта в одном месте.
      </p>

      <div class="hero-buttons">

        <a
          class="button button-primary"
          href="https://t.me/v4nty_bot"
          target="_blank"
          rel="noopener noreferrer"
        >
          Открыть бота
        </a>

        <a
          class="button button-secondary"

    </section>

      <div class="section-head">

            Последнее

async function searchPosts(
  value
) {
  try {
    const data =
      await request(
        `/api/posts?limit=100&q=${encodeURIComponent(
          value
        )}`
      );

    const container =
      document.getElementById(
        'posts'
      );

    if (!container) {
      return;
    }

    if (!data.posts.length) {
      container.innerHTML = `
        <div class="empty">
          Ничего не найдено.
        </div>
      `;

      return;
    }

    renderSearchResults(
      data.posts,
      container
    );
  } catch {
    showToast(
      'Ошибка поиска.'
    );
  }
}

) {

async function adminPage() {
  try {
    const data =
      await request(
        '/api/site'
      );

    site =
      data;
  } catch {}

  if (!site.isAdmin) {
    renderLogin();
    return;
  }

  try {
    const posts =
      await request(
        '/api/posts?limit=100'
      );

    adminPosts =
      posts.posts;
  } catch {
    adminPosts =
      [];
  }

  const r =
    route();

  const post =
    r.edit
      ? adminPosts.find(
          item =>
            Number(item.id) ===
            Number(r.edit)
        )
      : null;

  renderAdmin(
    post || null
  );
}

async function login(
  event
) {
  event.preventDefault();

  const login =
    document.getElementById(
      'login'
    ).value;

  const password =
    document.getElementById(
      'password'
    ).value;

  try {
    const data =
      await request(
        '/api/login',
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({
              login,
              password
            })
        }
      );

    localStorage.setItem(
      'v4nty_admin_token',
      data.token
    );

    site.isAdmin =
      true;

    location.hash =
      '#/admin';

    render();
  } catch (error) {
    const element =
      document.getElementById(
        'loginError'
      );

    element.textContent =
      error.message;

    element.classList.remove(
      'hidden'
    );
  }
}

function setupEditor() {
  const textarea =
    document.getElementById(
      'content'
    );

  document
    .querySelectorAll(
      '.toolbar button[data-before]'
    )
    .forEach(
      button => {
        button.addEventListener(
          'click',
          () => {
            insertFormat(
              textarea,
              button.dataset.before,
              button.dataset.after
            );

            updatePreview();
          }
        );
      }
    );

  document
    .getElementById(
      'linkTool'
    )
    ?.addEventListener(
      'click',
      () => {
        const url =
          prompt(
            'URL:',
            'https://'
          );

        if (!url) {
          return;
        }

        insertFormat(
          textarea,
          `<a href="${escAttr(url)}">`,
          '</a>'
        );

        updatePreview();
      }
    );

  textarea.addEventListener(
    'input',
    updatePreview
  );

  document
    .getElementById(
      'postForm'
    )
    .addEventListener(
      'submit',
      savePost
    );

  updatePreview();
}

function insertFormat(
  textarea,
  before,
  after
) {
  const start =
    textarea.selectionStart;

  const end =
    textarea.selectionEnd;

  const selected =
    textarea.value.slice(
      start,
      end
    );

  textarea.setRangeText(
    `${before}${selected || 'текст'}${after}`,
    start,
    end,
    'select'
  );

  textarea.focus();
}

let previewTimer;

function updatePreview() {
  clearTimeout(
    previewTimer
  );

  previewTimer =
    setTimeout(
      async () => {
        const content =
          document.getElementById(
            'content'
          );

        const preview =
          document.getElementById(
            'preview'
          );

        if (
          !content ||
          !preview
        ) {
          return;
        }

        try {
          const data =
            await request(
              '/api/preview',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body:
                  JSON.stringify({
                    html:
                      content.value
                  })
              }
            );

          preview.innerHTML =
            data.html ||
            'Введите текст...';
        } catch {
          preview.textContent =
            'Ошибка предпросмотра.';
        }
      },
      120
    );
}

async function savePost(
  event
) {
  event.preventDefault();

  const error =
    document.getElementById(
      'formError'
    );

  error.classList.add(
    'hidden'
  );

  const id =
    document.getElementById(
      'postId'
    ).value.trim();

  const data =
    new FormData();

  data.append(
    'title',
    document.getElementById(
      'postTitle'
    ).value.trim()
  );

  data.append(
    'contentHtml',
    document.getElementById(
      'content'
    ).value
  );

  data.append(
    'imageCaption',
    document.getElementById(
      'caption'
    ).value.trim()
  );

  data.append(
    'published',
    document.getElementById(
      'published'
    ).checked
      ? '1'
      : '0'
  );

  data.append(
    'removeImage',
    document.getElementById(
      'removeImage'
    )?.checked
      ? '1'
      : '0'
  );

  const file =
    document.getElementById(
      'image'
    ).files[0];

  if (file) {
    data.append(
      'image',
      file
    );
  }

  try {
    const result =
      await request(
        id
          ? `/api/admin/posts/${id}`
          : '/api/admin/posts',
        {
          method:
            id
              ? 'PUT'
              : 'POST',

          body:
            data
        }
      );

    showToast(
      'Пост сохранён.'
    );

    location.hash =
      `#/post/${encodeURIComponent(
        result.post.slug
      )}`;

    await render();
  } catch (err) {
    error.textContent =
      err.message;

    error.classList.remove(
      'hidden'
    );
  }
}

function editPost(
  id
) {
  const post =
    adminPosts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if (!post) {
    return;
  }

  location.hash =
    `#/admin?edit=${post.id}`;

  renderAdmin(
    post
  );
}

function newPost() {
  location.hash =
    '#/admin';

  renderAdmin();
}

async function deletePost(
  id
) {
  const post =
    adminPosts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if (!post) {
    return;
  }

  if (
    !confirm(
      `Удалить «${post.title}»?`
    )
  ) {
    return;
  }

  try {
    await request(
      `/api/admin/posts/${id}`,
      {
        method:
          'DELETE'
      }
    );

    showToast(
      'Пост удалён.'
    );

    await adminPage();
  } catch (error) {
    showToast(
      error.message
    );
  }
}

async function logout() {
  try {
    await request(
      '/api/logout',
      {
        method:
          'POST'
      }
    );
  } catch {}

  localStorage.removeItem(
    'v4nty_admin_token'
  );

  site.isAdmin =
    false;

  location.hash =
    '#/admin';

  render();
}

/* =========================
   MISC
========================= */

async function copyPost(
  slug
) {
  await copyText(
    `${location.origin}${location.pathname}#/post/${encodeURIComponent(
      slug
    )}`
  );
}

async function copyText(
  text
) {
  try {
    await navigator.clipboard.writeText(
      text
    );

    showToast(
      'Ссылка скопирована.'
    );
  } catch {
    showToast(
      'Не удалось скопировать ссылку.'
    );
  }
}

function debounce(
  callback,
  delay
) {
  let timer;

  return (...args) => {
    clearTimeout(
      timer
    );

    timer =
      setTimeout(
        () =>
          callback(...args),
        delay
      );
  };
}

async function render() {
  const current =
    route();

  if (
    current.type === 'home'
  ) {
    document.title =
      'V4nty | Бот';

    await home();

    return;
  }

  if (
    current.type === 'post'
  ) {
    await loadSite();

    await postPage(
      current.slug
    );

    return;
  }

  if (
    current.type === 'admin'
  ) {
    await adminPage();
  }
}

async function loadSite() {
  try {
    site =
      await request(
        '/api/site'
      );
  } catch {
    site = {
      isAdmin: false
    };
  }
}

window.addEventListener(
  'hashchange',
  render
);

render();
