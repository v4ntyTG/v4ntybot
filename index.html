<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="color-scheme" content="dark light">

  <title>V4nty | Бот</title>
  <meta
    name="description"
    content="V4nty | Бот — публикации, обновления и материалы."
  >

  <style>
    :root {
      --bg: #09090b;
      --bg-soft: #101012;
      --card: rgba(20, 20, 23, .82);
      --card-solid: #151518;
      --border: rgba(255, 255, 255, .09);
      --border-strong: rgba(255, 255, 255, .14);
      --text: #f5f5f7;
      --text-soft: #a1a1aa;
      --text-dim: #71717a;
      --accent: #ffffff;
      --accent-text: #09090b;
      --danger: #ff6b6b;
      --success: #72e6a7;
      --warning: #ffd166;
      --shadow: 0 18px 60px rgba(0, 0, 0, .32);
      --radius: 22px;
      --radius-sm: 14px;
      --content: 980px;
      --reading: 760px;
      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -15%, rgba(255, 255, 255, .07), transparent 32%),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: min(100% - 28px, var(--content));
      margin: 0 auto;
      padding: 18px 0 70px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: sticky;
      top: 12px;
      z-index: 50;
      margin-bottom: 30px;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(12, 12, 14, .76);
      backdrop-filter: blur(22px) saturate(140%);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .18);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
      text-decoration: none;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 11px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand-name {
      white-space: nowrap;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-btn,
    .ghost-btn,
    .primary-btn,
    .danger-btn {
      min-height: 38px;
      padding: 0 13px;
      border-radius: 11px;
      cursor: pointer;
      transition:
        transform var(--transition),
        background var(--transition),
        border-color var(--transition),
        opacity var(--transition);
    }

    .icon-btn:active,
    .ghost-btn:active,
    .primary-btn:active,
    .danger-btn:active {
      transform: scale(.97);
    }

    .icon-btn,
    .ghost-btn {
      color: var(--text);
      background: rgba(255, 255, 255, .055);
      border: 1px solid var(--border);
    }

    .icon-btn:hover,
    .ghost-btn:hover {
      background: rgba(255, 255, 255, .09);
      border-color: var(--border-strong);
    }

    .primary-btn {
      color: var(--accent-text);
      background: var(--accent);
      font-weight: 750;
    }

    .primary-btn:hover {
      opacity: .88;
    }

    .danger-btn {
      color: #fff;
      background: rgba(255, 107, 107, .11);
      border: 1px solid rgba(255, 107, 107, .22);
    }

    .danger-btn:hover {
      background: rgba(255, 107, 107, .17);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      padding: 28px 4px 20px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 16px rgba(114, 230, 167, .75);
    }

    .hero h1 {
      margin: 13px 0 10px;
      font-size: clamp(42px, 8vw, 74px);
      line-height: .95;
      letter-spacing: -.065em;
    }

    .hero p {
      max-width: 630px;
      margin: 0;
      color: var(--text-soft);
      font-size: 16px;
      line-height: 1.65;
    }

    /* =========================
       POSTS
    ========================= */

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 30px 3px 12px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 760;
      letter-spacing: -.02em;
    }

    .section-meta {
      color: var(--text-dim);
      font-size: 12px;
    }

    .posts {
      display: grid;
      gap: 12px;
    }

    .post-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(
        140deg,
        rgba(255, 255, 255, .045),
        rgba(255, 255, 255, .018)
      );
      box-shadow: var(--shadow);
    }

    .post-card-media {
      position: relative;
      overflow: hidden;
      background: #111113;
    }

    .post-card-media img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
    }

    .post-card-body {
      padding: 22px;
    }

    .post-card-title {
      margin: 0 0 9px;
      font-size: clamp(21px, 4vw, 30px);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    .post-card-excerpt {
      color: var(--text-soft);
      line-height: 1.68;
      font-size: 14px;
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin-top: 17px;
      color: var(--text-dim);
      font-size: 12px;
    }

    .meta-separator {
      opacity: .45;
    }

    .post-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 19px;
    }

    .read-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .read-link:hover {
      text-decoration: underline;
    }

    /* =========================
       POST VIEW
    ========================= */

    .reader {
      width: min(100%, var(--reading));
      margin: 0 auto;
    }

    .reader-head {
      margin: 34px 0 28px;
    }

    .reader-title {
      margin: 0;
      font-size: clamp(34px, 7vw, 60px);
      line-height: 1;
      letter-spacing: -.06em;
    }

    .reader-info {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 15px;
      color: var(--text-dim);
      font-size: 12px;
    }

    .reader-image {
      overflow: hidden;
      margin: 0 0 26px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #101012;
    }

    .reader-image img {
      width: 100%;
      max-height: 780px;
      object-fit: cover;
    }

    .reader-caption {
      padding: 12px 15px 15px;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.5;
    }

    .content {
      font-size: 17px;
      line-height: 1.82;
      word-wrap: break-word;
    }

    .content p {
      margin: 0 0 1.1em;
    }

    .content b,
    .content strong {
      font-weight: 780;
    }

    .content i,
    .content em {
      font-style: italic;
    }

    .content u {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .content s,
    .content strike,
    .content del {
      opacity: .7;
    }

    .content a {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .content code {
      padding: .16em .42em;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(255, 255, 255, .06);
      font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        monospace;
      font-size: .88em;
    }

    .content pre {
      overflow: auto;
      padding: 17px;
      margin: 1.2em 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #0c0c0f;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .content pre code {
      padding: 0;
      border: 0;
      background: transparent;
    }

    .content blockquote {
      margin: 1.2em 0;
      padding: 5px 0 5px 17px;
      border-left: 3px solid rgba(255, 255, 255, .28);
      color: var(--text-soft);
    }

    .content ul,
    .content ol {
      padding-left: 1.4em;
      margin: 1em 0;
    }

    .content li {
      margin: .38em 0;
    }

    .spoiler {
      display: inline;
      padding: 0 .2em;
      border-radius: 4px;
      color: transparent;
      background: currentColor;
      cursor: pointer;
      transition: color .18s ease;
    }

    .spoiler.revealed {
      color: inherit;
      background: rgba(255, 255, 255, .08);
    }

    .reader-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* =========================
       EMPTY / LOADING / ERROR
    ========================= */

    .state {
      padding: 55px 20px;
      text-align: center;
      border: 1px dashed var(--border-strong);
      border-radius: 20px;
      color: var(--text-soft);
    }

    .state-title {
      margin-bottom: 7px;
      color: var(--text);
      font-size: 16px;
      font-weight: 750;
    }

    .spinner {
      width: 24px;
      height: 24px;
      margin: 0 auto 14px;
      border: 2px solid rgba(255, 255, 255, .12);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       ADMIN
    ========================= */

    .admin {
      margin-top: 28px;
    }

    .admin-shell {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(255, 255, 255, .025);
      box-shadow: var(--shadow);
    }

    .admin-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
    }

    .admin-title {
      font-size: 15px;
      font-weight: 780;
    }

    .admin-tabs {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-btn {
      min-height: 35px;
      padding: 0 11px;
      border-radius: 9px;
      color: var(--text-soft);
      background: transparent;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--text);
      background: rgba(255, 255, 255, .08);
    }

    .admin-body {
      padding: 16px;
    }

    .editor-layout {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field-label {
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 700;
    }

    .input,
    .textarea,
    .codearea {
      width: 100%;
      outline: 0;
      color: var(--text);
      background: rgba(0, 0, 0, .17);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition:
        border-color var(--transition),
        box-shadow var(--transition);
    }

    .input {
      min-height: 45px;
      padding: 0 13px;
    }

    .textarea,
    .codearea {
      min-height: 170px;
      padding: 13px;
      line-height: 1.55;
      resize: vertical;
    }

    .codearea {
      min-height: 270px;
      font-family:
        "SFMono-Regular",
        "Cascadia Code",
        "Roboto Mono",
        monospace;
      font-size: 13px;
    }

    .input:focus,
    .textarea:focus,
    .codearea:focus {
      border-color: rgba(255, 255, 255, .24);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .045);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      padding: 8px;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      background: rgba(255, 255, 255, .026);
    }

    .tool-btn {
      min-height: 34px;
      min-width: 34px;
      padding: 0 9px;
      border-radius: 8px;
      color: var(--text-soft);
      background: transparent;
      cursor: pointer;
    }

    .tool-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, .07);
    }

    .toolbar + .codearea {
      border-radius: 0 0 12px 12px;
    }

    .image-picker {
      position: relative;
      padding: 17px;
      border: 1px dashed var(--border-strong);
      border-radius: 14px;
      background: rgba(255, 255, 255, .018);
    }

    .image-picker input {
      width: 100%;
      color: var(--text-soft);
      font-size: 13px;
    }

    .preview-image {
      display: none;
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      margin-top: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .editor-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255, 255, 255, .02);
      color: var(--text-soft);
      font-size: 13px;
      cursor: pointer;
    }

    .check input {
      accent-color: #fff;
    }

    .editor-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 3px;
    }

    .preview-box {
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255, 255, 255, .018);
    }

    .preview-label {
      margin-bottom: 12px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .admin-post-list {
      display: grid;
      gap: 9px;
    }

    .admin-post {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 13px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, .02);
    }

    .admin-post-main {
      min-width: 0;
    }

    .admin-post-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
      font-size: 14px;
    }

    .admin-post-meta {
      margin-top: 4px;
      color: var(--text-dim);
      font-size: 11px;
    }

    .admin-post-actions {
      display: flex;
      gap: 6px;
      flex: 0 0 auto;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-wrap {
      width: min(100%, 430px);
      margin: 85px auto 0;
    }

    .login-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .login-card h2 {
      margin: 0 0 7px;
      font-size: 24px;
      letter-spacing: -.04em;
    }

    .login-card p {
      margin: 0 0 20px;
      color: var(--text-soft);
      font-size: 13px;
      line-height: 1.6;
    }

    .login-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      padding: 45px 3px 0;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.7;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 15px;
      margin-top: 10px;
    }

    .footer-links a {
      color: var(--text-soft);
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 100;
      transform: translate(-50%, 20px);
      min-width: 220px;
      max-width: calc(100vw - 30px);
      padding: 12px 14px;
      text-align: center;
      border: 1px solid var(--border-strong);
      border-radius: 13px;
      background: rgba(20, 20, 23, .94);
      color: var(--text);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: .22s ease;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 650px) {
      .app {
        width: min(100% - 18px, var(--content));
        padding-top: 9px;
      }

      .header {
        top: 7px;
      }

      .hero {
        padding-top: 26px;
      }

      .post-card-body {
        padding: 17px;
      }

      .content {
        font-size: 16px;
      }

      .editor-row {
        grid-template-columns: 1fr;
      }

      .admin-post {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-post-actions {
        width: 100%;
      }

      .admin-post-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark">V</span>
        <span class="brand-name">V4nty | Бот</span>
      </a>

      <div class="header-actions">
        <button
          class="ghost-btn hidden"
          id="adminHeaderButton"
          type="button"
          title="Админ-панель"
        >
          Админ
        </button>

        <button
          class="icon-btn"
          id="homeButton"
          type="button"
          title="На главную"
        >
          Главная
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main id="appRoot"></main>

  <!-- FOOTER -->
  <footer class="footer">
    <div>© <span id="year"></span> V4nty</div>

    <div class="footer-links">
      <a href="https://t.me/v4nty_bot_channel" target="_blank" rel="noopener noreferrer">Канал</a>
      <a href="https://t.me/v4nty_bot_chat" target="_blank" rel="noopener noreferrer">Чат</a>
      <a href="https://t.me/v4nty" target="_blank" rel="noopener noreferrer">Владелец</a>
      <a href="https://t.me/v4nty_spamblock_bot" target="_blank" rel="noopener noreferrer">Поддержка</a>
      <a href="https://t.me/v4nty_bot" target="_blank" rel="noopener noreferrer">Бот</a>
    </div>
  </footer>

</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  /* =========================================================
     CONFIG
  ========================================================= */

  const API_URL = 'https://566ea72dbb9eba.lhr.life';

  const SITE = {
    name: 'V4nty | Бот',
    owner: 'v4nty',
    channel: 'https://t.me/v4nty_bot_channel',
    chat: 'https://t.me/v4nty_bot_chat',
    ownerUrl: 'https://t.me/v4nty',
    support: 'https://t.me/v4nty_spamblock_bot',
    bot: 'https://t.me/v4nty_bot'
  };

  const STORAGE = {
    token: 'v4nty_admin_token'
  };

  /* =========================================================
     ELEMENTS
  ========================================================= */

  const root = document.getElementById('appRoot');
  const toast = document.getElementById('toast');
  const adminHeaderButton = document.getElementById('adminHeaderButton');
  const homeButton = document.getElementById('homeButton');

  document.getElementById('year').textContent = new Date().getFullYear();

  /* =========================================================
     STATE
  ========================================================= */

  const state = {
    site: null,
    posts: [],
    currentPost: null,
    adminToken: localStorage.getItem(STORAGE.token) || '',
    editingId: null,
    selectedImage: null,
    loading: false
  };

  /* =========================================================
     HELPERS
  ========================================================= */

  function escapeHtml(value = '') {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function safeUrl(url = '') {
    try {
      const parsed = new URL(url, window.location.href);

      if (
        parsed.protocol === 'http:' ||
        parsed.protocol === 'https:' ||
        parsed.protocol === 'tg:'
      ) {
        return parsed.href;
      }

      return '#';
    } catch {
      return '#';
    }
  }

  function formatDate(value) {
    if (!value) return '';

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return new Intl.DateTimeFormat('ru-RU', {
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }).format(date);
  }

  function truncate(text, length = 180) {
    const clean = String(text || '')
      .replace(/<[^>]*>/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();

    if (clean.length <= length) {
      return clean;
    }

    return clean.slice(0, length).trimEnd() + '…';
  }

  function getImageUrl(filename) {
    if (!filename) return '';

    if (
      filename.startsWith('http://') ||
      filename.startsWith('https://')
    ) {
      return filename;
    }

    return `${API_URL.replace(/\/$/, '')}/uploads/${encodeURIComponent(filename)}`;
  }

  async function api(path, options = {}) {
    const headers = new Headers(options.headers || {});

    if (!headers.has('Accept')) {
      headers.set('Accept', 'application/json');
    }

    if (state.adminToken) {
      headers.set('Authorization', `Bearer ${state.adminToken}`);
    }

    const response = await fetch(
      `${API_URL.replace(/\/$/, '')}${path}`,
      {
        ...options,
        headers
      }
    );

    const text = await response.text();

    let data = null;

    try {
      data = text ? JSON.parse(text) : null;
    } catch {
      data = text;
    }

    if (!response.ok) {
      const message =
        data?.message ||
        data?.error ||
        `Ошибка API: ${response.status}`;

      throw new Error(message);
    }

    return data;
  }

  /* =========================================================
     TELEGRAM-STYLE HTML RENDERING
  ========================================================= */

  function renderTelegramHtml(html = '') {
    /*
      Сервер должен дополнительно санитизировать HTML.
      Клиент здесь тоже ограничивает опасные элементы.
    */

    const template = document.createElement('template');
    template.innerHTML = String(html);

    const blocked = [
      'script',
      'style',
      'iframe',
      'object',
      'embed',
      'form',
      'input',
      'button',
      'textarea',
      'select',
      'option',
      'meta',
      'link'
    ];

    template.content.querySelectorAll(blocked.join(',')).forEach(node => {
      node.remove();
    });

    template.content.querySelectorAll('*').forEach(node => {
      [...node.attributes].forEach(attr => {
        const name = attr.name.toLowerCase();
        const value = attr.value;

        if (name.startsWith('on')) {
          node.removeAttribute(attr.name);
          return;
        }

        if (
          name === 'href' &&
          !/^(https?:|tg:|mailto:)/i.test(value)
        ) {
          node.removeAttribute(attr.name);
        }

        if (
          name === 'src' &&
          !/^https?:/i.test(value)
        ) {
          node.removeAttribute(attr.name);
        }
      });
    });

    /*
      Telegram spoiler:
      <tg-spoiler>...</tg-spoiler>
    */
    template.content.querySelectorAll('tg-spoiler').forEach(node => {
      const span = document.createElement('span');
      span.className = 'spoiler';
      span.innerHTML = node.innerHTML;

      span.addEventListener('click', () => {
        span.classList.toggle('revealed');
      });

      node.replaceWith(span);
    });

    /*
      Некоторые редакторы могут отдавать <ins>.
    */
    template.content.querySelectorAll('ins').forEach(node => {
      const u = document.createElement('u');
      u.innerHTML = node.innerHTML;
      node.replaceWith(u);
    });

    return template.content;
  }

  function mountTelegramContent(element, html) {
    element.innerHTML = '';
    element.appendChild(renderTelegramHtml(html));
  }

  async function login() {
    const username =
      document.getElementById('loginUsername').value.trim();

    const password =
      document.getElementById('loginPassword').value;

    if (!username || !password) {
      showToast('Заполни логин и пароль');
      return;
    }

    const button = document.getElementById('loginSubmit');

    button.disabled = true;
    button.textContent = 'Вход…';

    try {
      const data = await api('/api/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          username,
          password
        })
      });

      const token =
        data?.token ||
        data?.accessToken ||
        data?.session?.token;

      if (!token) {
        throw new Error('Сервер не вернул токен авторизации.');
      }

      state.adminToken = token;

      localStorage.setItem(
        STORAGE.token,
        token
      );

      syncHeader();
      showToast('Вход выполнен');

      navigate('#/admin');
    } catch (error) {
      showToast(error.message);
      button.disabled = false;
      button.textContent = 'Войти';
    }
  }

    state.adminToken = '';
    localStorage.removeItem(STORAGE.token);
    state.editingId = null;

    navigate('#/');

  function bindEditor() {
    const textarea = document.getElementById('postContent');
    const preview = document.getElementById('livePreviewContent');
    const previewBox = document.getElementById('editorPreview');
    const imageInput = document.getElementById('postImage');
    const imagePreview = document.getElementById('imagePreview');

    function updatePreview() {
      mountTelegramContent(
        preview,
        textarea.value
      );
    }

    updatePreview();

    textarea.addEventListener('input', updatePreview);

    document
      .querySelectorAll('[data-wrap]')
      .forEach(button => {
        button.addEventListener('click', () => {
          wrapSelection(
            textarea,
            button.dataset.wrap
          );

          updatePreview();
          textarea.focus();
        });
      });

    const linkButton =
      document.querySelector('[data-link="true"]');

    if (linkButton) {
      linkButton.addEventListener('click', () => {
        const url = prompt(
          'URL:',
          'https://'
        );

        if (!url) return;

        insertLink(
          textarea,
          url
        );

        updatePreview();
        textarea.focus();
      });
    }

    document
      .getElementById('postPreview')
      .addEventListener('change', event => {
        previewBox.classList.toggle(
          'hidden',
          !event.target.checked
        );
      });

    imageInput.addEventListener('change', () => {
      const file = imageInput.files?.[0];

      state.selectedImage = file || null;

      if (!file) {
        imagePreview.style.display = 'none';
        imagePreview.removeAttribute('src');
        return;
      }

      if (file.size > 10 * 1024 * 1024) {
        showToast('Изображение больше 10 МБ');
        imageInput.value = '';
        state.selectedImage = null;
        return;
      }

      const url = URL.createObjectURL(file);

      imagePreview.src = url;
      imagePreview.style.display = 'block';
    });

    document
      .getElementById('savePostButton')
      .addEventListener('click', savePost);

    const deleteButton =
      document.getElementById('deletePostButton');

    if (deleteButton) {
      deleteButton.addEventListener(
        'click',
        deleteEditingPost
      );
    }

    document
      .getElementById('clearEditorButton')
      .addEventListener('click', () => {
        if (state.editingId !== null) {
          navigate('#/admin');
        } else {
          document.getElementById('postTitle').value = '';
          document.getElementById('postContent').value = '';
          document.getElementById('imageCaption').value = '';
          document.getElementById('postPublished').checked = true;
          document.getElementById('postImage').value = '';
          state.selectedImage = null;
          updatePreview();
          imagePreview.style.display = 'none';
          imagePreview.removeAttribute('src');
          showToast('Редактор очищен');
        }
      });
  }

  function bindAdminPostActions() {
    document
      .querySelectorAll('[data-admin-edit]')
      .forEach(button => {
        button.addEventListener('click', () => {
          navigate(
            `#/admin/edit/${encodeURIComponent(button.dataset.adminEdit)}`
          );
        });
      });

    document
      .querySelectorAll('[data-admin-delete]')
      .forEach(button => {
        button.addEventListener('click', async () => {
          await deletePostById(button.dataset.adminDelete);
        });
      });
  }

  function wrapSelection(textarea, tag) {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const selected = textarea.value.slice(start, end);

    const templates = {
      b: [`<b>`, `</b>`],
      i: [`<i>`, `</i>`],
      u: [`<u>`, `</u>`],
      s: [`<s>`, `</s>`],
      code: [`<code>`, `</code>`],
      'tg-spoiler': [`<tg-spoiler>`, `</tg-spoiler>`],
      blockquote: [`<blockquote>`, `</blockquote>`]
    };

    const pair = templates[tag];

    if (!pair) return;

    const replacement =
      pair[0] +
      (selected || 'текст') +
      pair[1];

    textarea.setRangeText(
      replacement,
      start,
      end,
      'end'
    );
  }

  function insertLink(textarea, url) {
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;

    const selected = textarea.value.slice(start, end);

    const replacement =
      `<a href="${escapeAttribute(url)}">${selected || 'ссылка'}</a>`;

    textarea.setRangeText(
      replacement,
      start,
      end,
      'end'
    );
  }

  function escapeAttribute(value) {
    return String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('"', '&quot;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;');
  }

  async function savePost() {
    const title =
      document.getElementById('postTitle').value.trim();

    const content =
      document.getElementById('postContent').value;

    const imageCaption =
      document.getElementById('imageCaption').value.trim();

    const published =
      document.getElementById('postPublished').checked;

    if (!title) {
      showToast('Укажи заголовок');
      return;
    }

    if (!content.trim()) {
      showToast('Добавь текст публикации');
      return;
    }

    const button =
      document.getElementById('savePostButton');

    button.disabled = true;
    button.textContent = 'Сохранение…';

    try {
      const form = new FormData();

      form.append('title', title);
      form.append('content_html', content);
      form.append('content', content);
      form.append('image_caption', imageCaption);
      form.append('published', String(published));

      if (state.selectedImage) {
        form.append(
          'image',
          state.selectedImage
        );
      }

      if (
        state.editingId !== null &&
        state.editingId !== undefined
      ) {
        await api(
          `/api/admin/posts/${encodeURIComponent(state.editingId)}`,
          {
            method: 'PUT',
            body: form
          }
        );

        showToast('Публикация обновлена');
      } else {
        await api(
          '/api/admin/posts',
          {
            method: 'POST',
            body: form
          }
        );

        showToast('Публикация создана');
      }

      state.selectedImage = null;

      await loadAdmin();
    } catch (error) {
      showToast(error.message);
      button.disabled = false;
      button.textContent =
        state.editingId !== null
          ? 'Сохранить изменения'
          : 'Опубликовать';
    }
  }

  async function deleteEditingPost() {
    if (
      state.editingId === null ||
      state.editingId === undefined
    ) {
      return;
    }

    await deletePostById(state.editingId);
  }

  async function deletePostById(id) {
    const post = state.posts.find(
      item => String(item.id) === String(id)
    );

    const title = post?.title || 'эту публикацию';

    const confirmed = confirm(
      `Удалить «${title}»? Это действие нельзя отменить.`
    );

    if (!confirmed) return;

    try {
      await api(
        `/api/admin/posts/${encodeURIComponent(id)}`,
        {
          method: 'DELETE'
        }
      );

      showToast('Публикация удалена');

      if (
        state.editingId !== null &&
        String(state.editingId) === String(id)
      ) {
        state.editingId = null;
      }

      await loadAdmin();
    } catch (error) {
      showToast(error.message);
    }
  }

  /* =========================================================
     ROUTER
  ========================================================= */

  async function renderRoute() {
    syncHeader();

    const current = route();

    if (
      current === '#/' ||
      current === '#' ||
      current === ''
    ) {
      await loadHome();
      return;
    }

    if (current === '#/login') {
      renderLogin();
      return;
    }

    if (current === '#/admin') {
      await loadAdmin();
      return;
    }

    const editMatch =
      current.match(/^#\/admin\/edit\/(.+)$/);

    if (editMatch) {
      if (!isAdmin()) {
        renderLogin();
        return;
      }

      await loadAdmin(
        decodeURIComponent(editMatch[1])
      );

      return;
    }

    const postMatch =
      current.match(/^#\/post\/(.+)$/);

    if (postMatch) {
      await loadPost(
        decodeURIComponent(postMatch[1])
      );

      return;
    }

    navigate('#/');
  }

  /* =========================================================
     GLOBAL EVENTS
  ========================================================= */

  window.addEventListener(
    'hashchange',
    renderRoute
  );

  homeButton.addEventListener(
    'click',
    () => navigate('#/')
  );

  adminHeaderButton.addEventListener(
    'click',
    () => navigate('#/admin')
  );

  /* =========================================================
     START
  ========================================================= */

  syncHeader();
  renderRoute();

})();
</script>
