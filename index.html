<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="V4nty | Бот — официальные публикации и обновления.">
  <title>V4nty | Бот</title>
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#747984;--border:#e5e7eb;--accent:#2457ff;--accent2:#1747df;--danger:#d92d45;--soft:#f1f3f6;--code:#17191d;--radius:18px;--small:11px;--max:1120px;--shadow:0 12px 36px rgba(20,25,35,.06)}
    html[data-theme="dark"]{--bg:#0e1014;--card:#16191f;--text:#f4f6f8;--muted:#9da3ae;--border:#2a2f38;--accent:#5b7cff;--accent2:#7490ff;--danger:#ff5b72;--soft:#1d222a;--code:#0a0c10;--shadow:0 18px 44px rgba(0,0,0,.22)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6;transition:background .18s,color .18s}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}img{max-width:100%}.hidden{display:none!important}.container{width:min(calc(100% - 28px),var(--max));margin:0 auto}
    header{position:sticky;top:0;z-index:50;height:68px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}.header-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none}.brand-logo{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:var(--text);color:var(--bg);font-weight:900}.brand-name{font-weight:800}.brand-muted{color:var(--muted)}nav{display:flex;align-items:center;gap:14px}nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:750}nav a:hover{color:var(--text)}
    .theme-btn{width:38px;height:38px;padding:0;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:16px}.hero{padding:78px 0 68px}.eyebrow{color:var(--accent);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.13em}.hero h1{margin:12px 0 15px;font-size:clamp(46px,8vw,76px);line-height:.95;letter-spacing:-.055em}.hero p{max-width:650px;margin:0;color:var(--muted);font-size:18px}.hero-buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}
    .button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border:1px solid transparent;border-radius:11px;font-size:13px;font-weight:800;text-decoration:none;transition:.15s}.button:hover{transform:translateY(-1px)}.button-primary{background:var(--accent);color:#fff}.button-primary:hover{background:var(--accent2)}.button-secondary{background:var(--card);color:var(--text);border-color:var(--border)}.button-danger{background:var(--danger);color:#fff}.button-small{min-height:34px;padding:0 10px;font-size:11px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.section-head h2{margin:4px 0 0;font-size:30px;letter-spacing:-.035em}.search{width:310px}.search input,.field input,.field textarea{width:100%;outline:none;border:1px solid var(--border);border-radius:var(--small);background:var(--card);color:var(--text)}.search input,.field input{min-height:44px;padding:0 13px}.field textarea{min-height:360px;padding:13px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.55}.search input:focus,.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 11%,transparent)}
    .posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.post-card{overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.post-card-image{width:100%;aspect-ratio:16/9;display:block;object-fit:cover}.post-card-body{padding:22px}.post-meta{color:var(--muted);font-size:11px;font-weight:700}.post-card h3{margin:8px 0;font-size:22px;line-height:1.15;letter-spacing:-.03em}.post-excerpt{margin:0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.post-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.empty,.loading{padding:55px 20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--muted);text-align:center}
    .article-page{max-width:840px;padding:45px 0 80px}.article-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700}.article-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:21px}.article-title{margin:36px 0 28px;font-size:clamp(38px,7vw,62px);line-height:1;letter-spacing:-.05em}.article-cover{margin:0 0 28px}.article-cover img{width:100%;max-height:640px;object-fit:cover;display:block;border-radius:var(--radius)}figure{margin-left:0;margin-right:0}.article-cover figcaption,.post-inline-image figcaption{margin-top:9px;color:var(--muted);text-align:center;font-size:12px}.content{font-size:18px;line-height:1.8;overflow-wrap:anywhere}.content a{color:var(--accent)}.content code{padding:2px 5px;border-radius:6px;background:var(--soft);font-size:.88em}.content pre{padding:17px;overflow-x:auto;border-radius:12px;background:var(--code);color:#f5f5f5}.content pre code{padding:0;background:none;color:inherit}.content blockquote{margin:18px 0;padding:12px 18px;border-left:4px solid var(--accent);border-radius:0 10px 10px 0;background:var(--soft);color:var(--muted)}.content hr{border:0;border-top:1px solid var(--border);margin:26px 0}.content mark{background:#ffe79a;color:#17191d;padding:1px 4px;border-radius:4px}.content small{font-size:.82em}.content h2,.content h3{line-height:1.15;letter-spacing:-.03em}.post-inline-image{margin:24px 0}.post-inline-image img{width:100%;display:block;border-radius:14px}.preview .post-inline-image{border:1px dashed var(--border);padding:14px;color:var(--muted);background:var(--soft)}
    .admin{padding:40px 0 80px}.auth-box{width:min(440px,100%);margin:55px auto;padding:25px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.auth-box h1{margin:6px 0}.auth-box p{color:var(--muted)}.field{margin-top:17px}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:800}.admin-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}.editor,.sidebar{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.editor{padding:24px}.sidebar{padding:18px;position:sticky;top:85px}.toolbar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.toolbar button{height:33px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:10px;font-weight:900}.toolbar button:hover{border-color:var(--accent);color:var(--accent)}.preview{margin-top:20px;padding:17px;background:var(--soft);border:1px solid var(--border);border-radius:12px}.preview-label{margin-bottom:8px;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.post-list{display:grid;gap:8px;margin-top:13px}.post-item{padding:12px;background:var(--soft);border:1px solid var(--border);border-radius:10px}.post-item-title{font-size:13px;font-weight:800}.post-item-meta{margin-top:3px;color:var(--muted);font-size:10px}.post-item-buttons{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.mini{min-height:29px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);text-decoration:none;font-size:10px;font-weight:800}.error{margin-top:10px;padding:10px;border-radius:9px;background:color-mix(in srgb,var(--danger) 8%,transparent);color:var(--danger);font-size:12px}.help{margin-top:6px;color:var(--muted);font-size:11px}.editor-images{display:grid;gap:9px;margin-top:10px}.editor-image{display:grid;grid-template-columns:80px minmax(0,1fr);gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--soft)}.editor-image img{width:80px;height:60px;object-fit:cover;border-radius:8px}.editor-image-controls{display:grid;gap:6px}.editor-image-controls input{min-height:34px;padding:0 9px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);outline:none}.editor-image-buttons{display:flex;flex-wrap:wrap;gap:5px}.admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.check{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:13px}.check input{width:auto}.file-help{margin-top:5px;color:var(--muted);font-size:11px}
    footer{margin-top:80px;padding:30px 0 45px;border-top:1px solid var(--border)}.footer{display:flex;justify-content:space-between;gap:25px}.footer p{margin:4px 0 0;color:var(--muted);font-size:12px}.footer-links{display:flex;flex-wrap:wrap;gap:15px}.footer-links a{color:var(--muted);text-decoration:none;font-size:12px;font-weight:700}.toast{position:fixed;left:50%;bottom:20px;z-index:1000;max-width:calc(100% - 30px);padding:11px 15px;border-radius:11px;background:var(--code);color:#fff;font-size:12px;font-weight:750;opacity:0;transform:translate(-50%,18px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:800px){.posts,.admin-layout{grid-template-columns:1fr}.sidebar{position:static}.section-head{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:580px){nav a:nth-child(2),nav a:nth-child(3){display:none}.hero{padding-top:50px}.hero h1{font-size:50px}.article-page{padding-top:30px}.article-title{margin-top:27px}.editor{padding:18px}.footer{flex-direction:column}.editor-image{grid-template-columns:64px minmax(0,1fr)}.editor-image img{width:64px;height:52px}}
  </style>
</head>
<body>
<header><div class="container header-inner">
  <a href="#/" class="brand"><span class="brand-logo">V</span><span class="brand-name">V4nty <span class="brand-muted">| Бот</span></span></a>
  <nav>
    <a href="#/">Публикации</a>
    <a href="https://t.me/v4nty_bot_channel" target="_blank" rel="noopener noreferrer">Канал</a>
    <a href="https://t.me/v4nty_bot" target="_blank" rel="noopener noreferrer">Бот</a>
    <a href="#/admin">Админ</a>
    <button class="theme-btn" id="themeBtn" type="button" title="Переключить тему" aria-label="Переключить тему">☾</button>
  </nav>
</div></header>
<main id="app"></main>
<footer><div class="container footer"><div><strong>V4nty | Бот</strong><p>Официальная площадка проекта.</p></div><div class="footer-links"><a href="https://t.me/v4nty_bot_channel" target="_blank" rel="noopener noreferrer">Канал</a><a href="https://t.me/v4nty_bot_chat" target="_blank" rel="noopener noreferrer">Чат</a><a href="https://t.me/v4nty" target="_blank" rel="noopener noreferrer">Владелец</a><a href="https://t.me/v4nty_spamblock_bot" target="_blank" rel="noopener noreferrer">Поддержка</a><a href="https://t.me/v4nty_bot" target="_blank" rel="noopener noreferrer">Бот</a></div></div></footer>
<div id="toast" class="toast"></div>
<script>
'use strict';
const API_URL='https://YOUR-WORKER.workers.dev';
const app=document.getElementById('app');
const toast=document.getElementById('toast');
let site={isAdmin:false};
let adminPosts=[];
let editorImages=[];
let newImageCounter=0;

const themeKey='v4nty_theme';
function applyTheme(){
  const saved=localStorage.getItem(themeKey)||'light';
  document.documentElement.dataset.theme=saved;
  document.getElementById('themeBtn').textContent=saved==='dark'?'☀':'☾';
}
function toggleTheme(){
  const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
  localStorage.setItem(themeKey,next); applyTheme();
}
document.getElementById('themeBtn').addEventListener('click',toggleTheme);
applyTheme();

function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2200)}
function esc(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function date(value){const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(d)}
function textFromHTML(html){const doc=new DOMParser().parseFromString(html,'text/html');return (doc.body.textContent||'').replace(/\s+/g,' ').trim()}
function apiURL(path){return API_URL.replace(/\/+$/,'')+path}
async function request(path,options={}){const headers={...(options.headers||{})};const token=localStorage.getItem('v4nty_admin_token');if(token)headers.Authorization=`Bearer ${token}`;const response=await fetch(apiURL(path),{...options,headers});let data=null;try{data=await response.json()}catch{}if(!response.ok){if(response.status===401){localStorage.removeItem('v4nty_admin_token');site.isAdmin=false}throw new Error(data?.error||'Ошибка сервера.')}return data}
function route(){const hash=location.hash||'#/';if(hash.startsWith('#/post/'))return{type:'post',slug:decodeURIComponent(hash.slice(7))};if(hash.startsWith('#/admin')){const index=hash.indexOf('?');const params=index===-1?new URLSearchParams():new URLSearchParams(hash.slice(index+1));return{type:'admin',edit:params.get('edit')}}return{type:'home'}}

async function home(){app.innerHTML='<div class="container loading">Загружаем публикации…</div>';try{const data=await request('/api/posts?limit=100');renderHome(data.posts)}catch(error){app.innerHTML=`<div class="container" style="padding-top:45px"><div class="empty">${esc(error.message)}</div></div>`}}
function postCard(post){const image=post.cover_url?`<img class="post-card-image" src="${esc(post.cover_url)}" alt="" loading="lazy">`:'';return `<article class="post-card">${image}<div class="post-card-body"><div class="post-meta">${date(post.created_at)} ${post.published?'':'· Черновик'}</div><h3>${esc(post.title)}</h3><p class="post-excerpt">${esc(textFromHTML(post.content_html))}</p><div class="post-actions"><a class="button button-primary" href="#/post/${encodeURIComponent(post.slug)}">Читать</a><button class="button button-secondary" onclick="copyPost('${esc(post.slug)}')">Копировать ссылку</button></div></div></article>`}
function renderHome(posts){app.innerHTML=`<section class="container hero"><div class="eyebrow">Официальная площадка</div><h1>V4nty | Бот</h1><p>Публикации, обновления и важная информация проекта в одном месте.</p><div class="hero-buttons"><a class="button button-primary" href="https://t.me/v4nty_bot" target="_blank" rel="noopener noreferrer">Открыть бота</a><a class="button button-secondary" href="https://t.me/v4nty_bot_channel" target="_blank" rel="noopener noreferrer">Наш канал</a></div></section><section class="container"><div class="section-head"><div><div class="eyebrow">Публикации</div><h2>Последнее</h2></div><div class="search"><input id="searchInput" type="search" placeholder="Поиск..." autocomplete="off"></div></div><div id="posts">${posts.length?`<div class="posts">${posts.map(postCard).join('')}</div>`:'<div class="empty">Публикаций пока нет.</div>'}</div></section>`;document.getElementById('searchInput')?.addEventListener('input',debounce(e=>searchPosts(e.target.value),250))}
async function searchPosts(value){try{const data=await request(`/api/posts?limit=100&q=${encodeURIComponent(value)}`);const container=document.getElementById('posts');if(!container)return;if(!data.posts.length){container.innerHTML='<div class="empty">Ничего не найдено.</div>';return}container.innerHTML=`<div class="posts">${data.posts.map(postCard).join('')}</div>`}catch{showToast('Ошибка поиска.')}}

async function postPage(slug){app.innerHTML='<div class="container loading">Загружаем публикацию…</div>';try{const data=await request(`/api/posts/${encodeURIComponent(slug)}`);const post=data.post;document.title=`${post.title} — V4nty | Бот`;app.innerHTML=`<article class="container article-page"><div class="article-top"><a href="#/" class="back">← Все публикации</a><span class="post-meta">${date(post.updated_at)}</span></div><div class="article-actions"><button class="button button-secondary" id="copyLink">Копировать ссылку</button>${site.isAdmin?`<a class="button button-primary" href="#/admin?edit=${post.id}">Изменить</a>`:''}</div><h1 class="article-title">${esc(post.title)}</h1>${post.cover_url?`<figure class="article-cover"><img src="${esc(post.cover_url)}" alt="${esc(post.cover_caption||post.title)}">${post.cover_caption?`<figcaption>${esc(post.cover_caption)}</figcaption>`:''}</figure>`:''}<div class="content">${post.content_html}</div></article>`;document.getElementById('copyLink')?.addEventListener('click',()=>copyText(location.href))}catch{app.innerHTML='<div class="container article-page"><div class="empty">Публикация не найдена.</div></div>'}}

async function loadSite(){try{site=await request('/api/site')}catch{site={isAdmin:false}}}
async function adminPage(){await loadSite();if(!site.isAdmin){renderLogin();return}try{adminPosts=(await request('/api/posts?limit=100')).posts}catch{adminPosts=[]}const r=route();const post=r.edit?adminPosts.find(x=>Number(x.id)===Number(r.edit)):null;renderAdmin(post||null)}
function renderLogin(){app.innerHTML=`<section class="container admin"><div class="auth-box"><div class="eyebrow">Закрытая зона</div><h1>Администратор</h1><p>Управление публикациями V4nty | Бот.</p><form id="loginForm"><div class="field"><label>Логин</label><input id="login" type="text" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><div class="field"><button class="button button-primary" style="width:100%" type="submit">Войти</button></div><div id="loginError" class="error hidden"></div></form></div></section>`;document.getElementById('loginForm').addEventListener('submit',login)}
async function login(event){event.preventDefault();try{const data=await request('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login').value,password:document.getElementById('password').value})});localStorage.setItem('v4nty_admin_token',data.token);site.isAdmin=true;location.hash='#/admin';render()}catch(error){const element=document.getElementById('loginError');element.textContent=error.message;element.classList.remove('hidden')}}

function resetEditorImages(post){editorImages=(post?.content_images||[]).map(x=>({id:Number(x.id),url:x.url,caption:x.caption||'',name:`Изображение #${x.id}`,file:null,token:null}));newImageCounter=0}
function imageEditorHTML(){if(!editorImages.length)return '<div class="help">Изображений внутри поста пока нет.</div>';return `<div class="editor-images">${editorImages.map((img,i)=>`<div class="editor-image"><img src="${esc(img.url||'')}" alt=""><div class="editor-image-controls"><input data-image-index="${i}" class="image-caption-input" value="${esc(img.caption||'')}" placeholder="Краткое описание"><div class="editor-image-buttons"><button type="button" class="mini" onclick="insertPostImage(${i})">Вставить</button><button type="button" class="mini" onclick="removePostImage(${i})">Удалить</button></div></div></div>`).join('')}</div>`}
function renderAdmin(post=null){resetEditorImages(post);const editing=Boolean(post);app.innerHTML=`<section class="container admin"><div class="section-head"><div><div class="eyebrow">Панель управления</div><h2>${editing?'Изменение поста':'Новый пост'}</h2></div><div style="display:flex;flex-wrap:wrap;gap:7px"><button class="button button-secondary" onclick="newPost()">Новый</button><button class="button button-secondary" onclick="logout()">Выйти</button></div></div><div class="admin-layout"><div class="editor"><form id="postForm"><input type="hidden" id="postId" value="${post?.id||''}"><div class="field"><label>Заголовок</label><input id="postTitle" maxlength="180" value="${esc(post?.title||'')}" placeholder="Например: Большое обновление бота" required></div><div class="field"><label>Обложка поста</label><input id="coverImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="file-help">Это главное фото карточки и статьи. До 12 МБ.</div>${post?.cover_url?`<div style="margin-top:9px"><img src="${esc(post.cover_url)}" style="width:180px;aspect-ratio:16/9;object-fit:cover;border-radius:10px" alt=""></div><label class="check"><input id="removeCover" type="checkbox"> Удалить текущую обложку</label>`:''}</div><div class="field"><label>Подпись к обложке</label><input id="coverCaption" maxlength="500" value="${esc(post?.cover_caption||'')}" placeholder="Краткое описание фото"></div><div class="field"><label>Форматированный текст</label><div class="toolbar"><button type="button" data-before="<b>" data-after="</b>">B</button><button type="button" data-before="<i>" data-after="</i>">I</button><button type="button" data-before="<u>" data-after="</u>">U</button><button type="button" data-before="<s>" data-after="</s>">S</button><button type="button" data-before="<mark>" data-after="</mark>">MARK</button><button type="button" data-before="<small>" data-after="</small>">SMALL</button><button type="button" data-before="<sub>" data-after="</sub>">SUB</button><button type="button" data-before="<sup>" data-after="</sup>">SUP</button><button type="button" data-before="<code>" data-after="</code>">CODE</button><button type="button" data-before="<pre><code>" data-after="</code></pre>">PRE</button><button type="button" data-before="<blockquote>" data-after="</blockquote>">QUOTE</button><button type="button" data-before="<tg-spoiler>" data-after="</tg-spoiler>">SPOILER</button><button type="button" data-before="<h2>" data-after="</h2>">H2</button><button type="button" data-before="<h3>" data-after="</h3>">H3</button><button type="button" data-before="<p>" data-after="</p>">P</button><button type="button" id="ulTool">• LIST</button><button type="button" id="olTool">1. LIST</button><button type="button" id="hrTool">HR</button><button type="button" id="linkTool">LINK</button></div><textarea id="content" maxlength="250000" required placeholder="<h2>Заголовок раздела</h2>\n\n<b>Важный текст</b>\n\nОбычный абзац">${esc(post?.content_html||'')}</textarea></div><div class="field"><label>Изображения внутри поста</label><input id="contentImagesInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div class="file-help">Можно добавить до 30 изображений. После выбора нажми «Вставить» у нужного изображения — оно появится там, где стоит курсор.</div><div id="editorImagesWrap">${imageEditorHTML()}</div></div><label class="check"><input id="published" type="checkbox" ${post?.published!==0?'checked':''}> Опубликовано</label><div class="preview"><div class="preview-label">Предпросмотр</div><div id="preview" class="content">Введите текст...</div></div><div class="admin-actions"><button class="button button-primary" type="submit">Сохранить</button><button class="button button-secondary" type="button" onclick="newPost()">Очистить</button></div><div id="formError" class="error hidden"></div></form></div><aside class="sidebar"><div class="eyebrow">Все посты</div><div id="postList" class="post-list"></div></aside></div></section>`;setupEditor();fillAdminPosts()}
function setupEditor(){const textarea=document.getElementById('content');document.querySelectorAll('.toolbar button[data-before]').forEach(button=>button.addEventListener('click',()=>{insertFormat(textarea,button.dataset.before,button.dataset.after);updatePreview()}));document.getElementById('linkTool').addEventListener('click',()=>{const url=prompt('URL:','https://');if(!url)return;insertFormat(textarea,`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">`,'</a>');updatePreview()});document.getElementById('ulTool').addEventListener('click',()=>{wrapLines(textarea,'<ul>','</ul>','<li>','</li>');updatePreview()});document.getElementById('olTool').addEventListener('click',()=>{wrapLines(textarea,'<ol>','</ol>','<li>','</li>');updatePreview()});document.getElementById('hrTool').addEventListener('click',()=>{insertFormat(textarea,'<p>','</p>');textarea.setRangeText('<hr>',textarea.selectionStart,textarea.selectionEnd,'end');updatePreview()});textarea.addEventListener('input',updatePreview);document.getElementById('contentImagesInput').addEventListener('change',addContentImages);document.getElementById('postForm').addEventListener('submit',savePost);document.querySelectorAll('.image-caption-input').forEach(el=>el.addEventListener('input',()=>{const i=Number(el.dataset.imageIndex);if(editorImages[i])editorImages[i].caption=el.value}));updatePreview()}
function insertFormat(textarea,before,after){const start=textarea.selectionStart,end=textarea.selectionEnd,selected=textarea.value.slice(start,end);textarea.setRangeText(`${before}${selected||'текст'}${after}`,start,end,'select');textarea.focus()}
function wrapLines(textarea,open,close,itemOpen,itemClose){const start=textarea.selectionStart,end=textarea.selectionEnd;const selected=textarea.value.slice(start,end).trim()||'текст';const lines=selected.split(/\n+/).map(x=>x.trim()).filter(Boolean);const result=`${open}\n${lines.map(x=>`${itemOpen}${x}${itemClose}`).join('\n')}\n${close}`;textarea.setRangeText(result,start,end,'select');textarea.focus()}
async function addContentImages(event){const files=[...event.target.files];for(const file of files){if(editorImages.length>=30){showToast('Максимум 30 изображений.');break}editorImages.push({id:null,url:URL.createObjectURL(file),caption:'',name:file.name,file,token:`new_${newImageCounter++}`})}event.target.value='';renderEditorImageList();updatePreview()}
function renderEditorImageList(){const wrap=document.getElementById('editorImagesWrap');if(wrap)wrap.innerHTML=imageEditorHTML();document.querySelectorAll('.image-caption-input').forEach(el=>el.addEventListener('input',()=>{const i=Number(el.dataset.imageIndex);if(editorImages[i])editorImages[i].caption=el.value}))}
function insertPostImage(index){const img=editorImages[index];if(!img)return;const textarea=document.getElementById('content');const tag=img.id?`<v4nty-image data-image-id="${img.id}"></v4nty-image>`:`<v4nty-image data-image-token="${img.token}"></v4nty-image>`;const pos=textarea.selectionStart;textarea.setRangeText(`\n${tag}\n`,pos,pos,'end');textarea.focus();updatePreview()}
function removePostImage(index){const img=editorImages[index];if(!img)return;const textarea=document.getElementById('content');if(img.id)textarea.value=textarea.value.replaceAll(`<v4nty-image data-image-id="${img.id}"></v4nty-image>`,'');if(img.token)textarea.value=textarea.value.replaceAll(`<v4nty-image data-image-token="${img.token}"></v4nty-image>`,'');if(img.file)URL.revokeObjectURL(img.url);editorImages.splice(index,1);renderEditorImageList();updatePreview()}
let previewTimer;function updatePreview(){clearTimeout(previewTimer);previewTimer=setTimeout(()=>{const content=document.getElementById('content'),preview=document.getElementById('preview');if(!content||!preview)return;let html=content.value||'Введите текст...';html=html.replace(/<v4nty-image\s+[^>]*data-image-id=["'](\d+)["'][^>]*><\/v4nty-image\s*>/gi,(_m,id)=>{const image=editorImages.find(x=>Number(x.id)===Number(id));return image?`<figure class="post-inline-image"><img src="${esc(image.url)}" alt=""><figcaption>${esc(image.caption||'Изображение')}</figcaption></figure>`:`<div class="post-inline-image">Изображение не найдено</div>`});html=html.replace(/<v4nty-image\s+[^>]*data-image-token=["']([^"']+)["'][^>]*><\/v4nty-image\s*>/gi,(_m,token)=>{const image=editorImages.find(x=>x.token===token);return image?`<figure class="post-inline-image"><img src="${esc(image.url)}" alt=""><figcaption>${esc(image.caption||'Новое изображение')}</figcaption></figure>`:''});preview.innerHTML=html},120)}
function fillAdminPosts(){const list=document.getElementById('postList');if(!list)return;if(!adminPosts.length){list.innerHTML='<div class="loading">Постов пока нет.</div>';return}list.innerHTML=adminPosts.map(post=>`<div class="post-item"><div class="post-item-title">${esc(post.title)}</div><div class="post-item-meta">#${post.id} · ${post.published?'опубликован':'черновик'}</div><div class="post-item-buttons"><button class="mini" onclick="editPost(${post.id})">Изменить</button><a class="mini" href="#/post/${encodeURIComponent(post.slug)}">Открыть</a><button class="mini" onclick="deletePost(${post.id})">Удалить</button></div></div>`).join('')}
async function savePost(event){event.preventDefault();const error=document.getElementById('formError');error.classList.add('hidden');const id=document.getElementById('postId').value.trim();const data=new FormData();data.append('title',document.getElementById('postTitle').value.trim());data.append('contentHtml',document.getElementById('content').value);data.append('coverCaption',document.getElementById('coverCaption').value.trim());data.append('published',document.getElementById('published').checked?'1':'0');data.append('removeCover',document.getElementById('removeCover')?.checked?'1':'0');const cover=document.getElementById('coverImage').files[0];if(cover)data.append('coverImage',cover);const metadata=editorImages.map(x=>x.id?{id:x.id,caption:x.caption}:{token:x.token,caption:x.caption});data.append('contentImages',JSON.stringify(metadata));for(const img of editorImages)if(img.file)data.append(`contentImage_${img.token}`,img.file,img.file.name);try{const result=await request(id?`/api/admin/posts/${id}`:'/api/admin/posts',{method:id?'PUT':'POST',body:data});showToast('Пост сохранён.');location.hash=`#/post/${encodeURIComponent(result.post.slug)}`;await render()}catch(err){error.textContent=err.message;error.classList.remove('hidden')}}
function editPost(id){location.hash=`#/admin?edit=${id}`;render()}
function newPost(){location.hash='#/admin';render()}
async function deletePost(id){const post=adminPosts.find(x=>Number(x.id)===Number(id));if(!post)return;if(!confirm(`Удалить «${post.title}»?`))return;try{await request(`/api/admin/posts/${id}`,{method:'DELETE'});showToast('Пост удалён.');await adminPage()}catch(error){showToast(error.message)}}
async function logout(){try{await request('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('v4nty_admin_token');site.isAdmin=false;location.hash='#/admin';render()}
async function copyPost(slug){await copyText(`${location.origin}${location.pathname}#/post/${encodeURIComponent(slug)}`)}
async function copyText(text){try{await navigator.clipboard.writeText(text);showToast('Ссылка скопирована.')}catch{showToast('Не удалось скопировать ссылку.')}}
function debounce(callback,delay){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>callback(...args),delay)}}
async function render(){const current=route();if(current.type==='home'){document.title='V4nty | Бот';await home();return}if(current.type==='post'){await loadSite();await postPage(current.slug);return}if(current.type==='admin')await adminPage()}
window.addEventListener('hashchange',render);render();
</script>
</body>
