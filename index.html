<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="V4nty | Бот — официальные публикации и обновления."
  >

  <title>V4nty | Бот</title>

  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #16181d;
      --muted: #747984;
      --border: #e5e7eb;

      --accent: #2457ff;
      --accent-hover: #1845db;

      --danger: #d92d45;

      --radius: 18px;
      --radius-small: 11px;

      --shadow:
        0 10px 35px rgba(20, 25, 35, .06);

      --max: 1080px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      line-height: 1.6;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    img {
      max-width: 100%;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(
        calc(100% - 28px),
        var(--max)
      );

      margin: 0 auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 68px;

      background:
        rgba(245, 246, 248, .88);

      backdrop-filter: blur(18px);

      border-bottom:
        1px solid var(--border);
    }

    .header-inner {
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;

      gap: 10px;

      text-decoration: none;
    }

    .brand-logo {
      width: 36px;
      height: 36px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: var(--text);
      color: #fff;

      font-weight: 900;
      font-size: 17px;
    }

    .brand-name {
      font-weight: 800;
      font-size: 16px;
    }

    .brand-sub {
      color: var(--muted);
      font-weight: 600;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    nav a {
      color: var(--muted);

      text-decoration: none;

      font-size: 13px;
      font-weight: 700;
    }

    nav a:hover {
      color: var(--text);
    }

    /* HERO */

    .hero {
      padding: 80px 0 70px;
    }

    .eyebrow {
      color: var(--accent);

      text-transform: uppercase;

      letter-spacing: .12em;

      font-size: 11px;
      font-weight: 900;
    }

    .hero h1 {
      margin: 12px 0 15px;

      font-size:
        clamp(45px, 8vw, 76px);

      line-height: .96;

      letter-spacing: -.055em;
    }

    .hero p {
      max-width: 650px;

      margin: 0;

      color: var(--muted);

      font-size: 18px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;

      gap: 9px;

      margin-top: 28px;
    }

    /* BUTTON */

    .button {
      min-height: 44px;

      padding:
        0 16px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid transparent;

      border-radius:
        11px;

      font-size: 13px;
      font-weight: 800;

      text-decoration: none;

      transition:
        .15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
    }

    .button-primary {
      background: var(--accent);
      color: #fff;
    }

    .button-primary:hover {
      background: var(--accent-hover);
    }

    .button-secondary {
      background: var(--card);
      border-color: var(--border);
      color: var(--text);
    }

    .button-danger {
      background: var(--danger);
      color: #fff;
    }

    /* POSTS */

    .section-title {
      display: flex;
      align-items: end;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 22px;
    }

    .section-title h2 {
      margin: 4px 0 0;

      font-size: 30px;

      letter-spacing: -.03em;
    }

    .search {
      width: 300px;
    }

    .search input {
      width: 100%;
      height: 43px;

      padding: 0 13px;

      border:
        1px solid var(--border);

      border-radius:
        11px;

      outline: none;

      background: var(--card);
      color: var(--text);
    }

    .search input:focus,
    input:focus,
    textarea:focus {
      border-color: var(--accent);

      box-shadow:
        0 0 0 4px
        rgba(36, 87, 255, .08);
    }

    .posts {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 16px;
    }

    .post-card {
      overflow: hidden;

      background: var(--card);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);
    }

    .post-card img {
      width: 100%;

      aspect-ratio: 16 / 9;

      object-fit: cover;

      display: block;
    }

    .post-card-body {
      padding: 22px;
    }

    .post-meta {
      color: var(--muted);

      font-size: 11px;
      font-weight: 700;
    }

    .post-card h3 {
      margin: 8px 0 8px;

      font-size: 22px;
      line-height: 1.15;

      letter-spacing: -.03em;
    }

    .post-excerpt {
      margin: 0;

      color: var(--muted);

      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .post-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 7px;

      margin-top: 18px;
    }

    /* ARTICLE */

    .article-page {
      max-width: 840px;

      padding:
        48px 0
        80px;
    }

    .article-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .back {
      text-decoration: none;

      color: var(--muted);

      font-size: 13px;
      font-weight: 700;
    }

    .article-meta {
      color: var(--muted);

      font-size: 12px;
    }

    .article-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 22px;
    }

    .article h1 {
      margin:
        38px 0 28px;

      font-size:
        clamp(38px, 7vw, 62px);

      line-height: 1;

      letter-spacing: -.05em;
    }

    .article-image {
      margin-bottom: 28px;
    }

    .article-image img {
      width: 100%;

      max-height: 630px;

      object-fit: cover;

      border-radius:
        var(--radius);

      display: block;
    }

    .article-image figcaption {
      margin-top: 9px;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    .content {
      font-size: 18px;

      line-height: 1.8;

      overflow-wrap: anywhere;
    }

    .content a {
      color: var(--accent);
    }

    .content code {
      padding:
        2px 5px;

      border-radius: 6px;

      background: #eceef2;

      font-size: .88em;
    }

    .content pre {
      padding: 17px;

      background: #17191d;
      color: #f5f5f5;

      border-radius: 12px;

      overflow-x: auto;
    }

    .content pre code {
      background: none;
      padding: 0;
      color: inherit;
    }

    .content blockquote {
      margin:
        18px 0;

      padding:
        12px 18px;

      border-left:
        4px solid var(--accent);

      border-radius:
        0 10px 10px 0;

      background:
        var(--card);

      color: #565b65;
    }

    .content tg-spoiler {
      padding:
        1px 5px;

      border-radius: 4px;

      background: var(--text);

      color: transparent;

      cursor: pointer;
    }

    .content tg-spoiler:hover {
      color: inherit;
    }

    /* ADMIN */

    .admin {
      padding:
        40px 0
        80px;
    }

    .auth-box {
      max-width: 440px;

      margin:
        60px auto;

      padding: 25px;

      background: var(--card);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      box-shadow: var(--shadow);
    }

    .auth-box h1 {
      margin: 6px 0;
    }

    .auth-box p {
      color: var(--muted);
    }

    .field {
      margin-top: 16px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 12px;
      font-weight: 800;
    }

    input,
    textarea {
      width: 100%;

      padding:
        12px 13px;

      border:
        1px solid var(--border);

      border-radius:
        11px;

      outline: none;

      background: var(--card);

      color: var(--text);
    }

    textarea {
      min-height: 330px;

      resize: vertical;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size: 13px;

      line-height: 1.55;
    }

    .admin-layout {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        310px;

      gap: 18px;

      align-items: start;
    }

    .editor,
    .sidebar {
      background: var(--card);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      box-shadow: var(--shadow);
    }

    .editor {
      padding: 25px;
    }

    .sidebar {
      padding: 18px;

      position: sticky;
      top: 88px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;

      gap: 5px;

      margin-bottom: 8px;
    }

    .toolbar button {
      height: 33px;

      padding:
        0 9px;

      border:
        1px solid var(--border);

      border-radius: 8px;

      background: var(--card);

      font-size: 11px;
      font-weight: 900;
    }

    .toolbar button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .preview {
      margin-top: 20px;

      padding: 17px;

      border:
        1px solid var(--border);

      border-radius:
        12px;

      background:
        #fafbfc;
    }

    .preview-title {
      margin-bottom: 9px;

      color: var(--muted);

      font-size: 10px;
      font-weight: 900;

      letter-spacing: .1em;

      text-transform: uppercase;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 20px;
    }

    .file-help {
      color: var(--muted);

      font-size: 11px;
    }

    .post-list {
      display: grid;

      gap: 8px;

      margin-top: 13px;
    }

    .post-item {
      padding: 12px;

      border:
        1px solid var(--border);

      border-radius:
        10px;

      background:
        #fafbfc;
    }

    .post-item-title {
      font-size: 13px;
      font-weight: 800;
    }

    .post-item-meta {
      margin-top: 3px;

      color: var(--muted);

      font-size: 10px;
    }

    .post-item-buttons {
      display: flex;
      flex-wrap: wrap;

      gap: 5px;

      margin-top: 9px;
    }

    .mini {
      min-height: 30px;

      padding:
        0 9px;

      border:
        1px solid var(--border);

      border-radius: 8px;

      background: var(--card);

      font-size: 10px;
      font-weight: 800;

      text-decoration: none;
    }

    .error {
      margin-top: 10px;

      padding: 10px;

      border-radius: 9px;

      background:
        rgba(217, 45, 69, .07);

      color: var(--danger);

      font-size: 12px;
    }

    /* FOOTER */

    footer {
      margin-top: 80px;

      padding:
        30px 0
        45px;

      border-top:
        1px solid var(--border);
    }

    .footer {
      display: flex;
      justify-content: space-between;

      gap: 25px;
    }

    .footer p {
      margin: 4px 0 0;

      color: var(--muted);

      font-size: 12px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;

      gap: 15px;

      align-items: start;
    }

    .footer-links a {
      color: var(--muted);

      text-decoration: none;

      font-size: 12px;
      font-weight: 700;
    }

    /* STATES */

    .empty {
      padding: 55px 15px;

      text-align: center;

      color: var(--muted);

      background: var(--card);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);
    }

    .loading {
      padding: 45px 0;

      text-align: center;

      color: var(--muted);
    }

    .toast {
      position: fixed;

      left: 50%;
      bottom: 20px;

      z-index: 1000;

      padding:
        11px 15px;

      border-radius: 11px;

      background: #17191d;

      color: white;

      font-size: 12px;
      font-weight: 750;

      opacity: 0;

      transform:
        translate(-50%, 18px);

      pointer-events: none;

      transition: .2s ease;
    }

    .toast.show {
      opacity: 1;

      transform:
        translate(-50%, 0);
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .posts {
        grid-template-columns: 1fr;
      }

      .admin-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
      }

      .section-title {
        align-items: stretch;
        flex-direction: column;
      }

      .search {
        width: 100%;
      }

      .footer {
        flex-direction: column;
      }
    }

    @media (max-width: 580px) {
      nav a:nth-child(2),
      nav a:nth-child(3) {
        display: none;
      }

      .hero {
        padding-top: 50px;
      }

      .hero h1 {
        font-size: 50px;
      }

      .article-page {
        padding-top: 30px;
      }

      .article h1 {
        margin-top: 28px;
      }

      .editor {
        padding: 18px;
      }

      .auth-box {
        margin:
          30px auto;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">

    <a
      href="#/"
      class="brand"
    >
      <span class="brand-logo">V</span>

      <span class="brand-name">
        V4nty <span class="brand-sub">| Бот</span>
      </span>
    </a>

    <nav>

      <a href="#/">
        Публикации
      </a>

      <a
        href="https://t.me/v4nty_bot_channel"
        target="_blank"
        rel="noopener noreferrer"
      >
        Канал
      </a>

      <a
        href="https://t.me/v4nty_bot"
        target="_blank"
        rel="noopener noreferrer"
      >
        Бот
      </a>

      <a href="#/admin">
        Админ
      </a>

    </nav>

  </div>
</header>

<main id="app"></main>

<footer>
  <div class="container footer">

    <div>
      <strong>
        V4nty | Бот
      </strong>

      <p>
        Официальная публикационная площадка проекта.
      </p>
    </div>

    <div class="footer-links">

      <a
        href="https://t.me/v4nty"
        target="_blank"
        rel="noopener noreferrer"
      >
        Владелец
      </a>

      <a
        href="https://t.me/v4nty_spamblock_bot"
        target="_blank"
        rel="noopener noreferrer"
      >
        Поддержка
      </a>

      <a
        href="https://t.me/v4nty_bot_chat"
        target="_blank"
        rel="noopener noreferrer"
      >
        Чат
      </a>

    </div>

  </div>
</footer>

<div
  id="toast"
  class="toast"
></div>

<script>
'use strict';

const app =
  document.getElementById('app');

const toast =
  document.getElementById('toast');

let siteData = {
  isAdmin: false
};

let adminPosts = [];

function toastMessage(message) {
  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(toastMessage.timer);

  toastMessage.timer =
    setTimeout(() => {
      toast.classList.remove('show');
    }, 2200);
}

function escapeHTML(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function escapeAttr(value) {
  return escapeHTML(value);
}

function formatDate(value) {
  const date =
    new Date(value);

  if (Number.isNaN(date.getTime())) {
    return '';
  }

  return new Intl.DateTimeFormat(
    'ru-RU',
    {
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }
  ).format(date);
}

function plainText(html) {
  const doc =
    new DOMParser()
      .parseFromString(
        html,
        'text/html'
      );

  return (
    doc.body.textContent || ''
  )
    .replace(/\s+/g, ' ')
    .trim();
}

async function api(
  url,
  options = {}
) {
  const response =
    await fetch(
      url,
      {
        credentials: 'same-origin',
        ...options
      }
    );

  let data = null;

  try {
    data =
      await response.json();
  } catch {
    data = null;
  }

  if (!response.ok) {
    throw new Error(
      data?.error ||
      'Произошла ошибка.'
    );
  }

  return data;
}

function getRoute() {
  const hash =
    location.hash || '#/';

  if (hash.startsWith('#/post/')) {
    return {
      type: 'post',
      slug: decodeURIComponent(
        hash.slice(7)
      )
    };
  }

  if (hash === '#/admin') {
    return {
      type: 'admin'
    };
  }

  return {
    type: 'home'
  };
}

async function loadSite() {
  try {
    const data =
      await api('/api/site');

    siteData =
      data;
  } catch {
    siteData = {
      isAdmin: false
    };
  }
}

function renderHome(posts) {
  const cards =
    posts.map((post) => {
      const image =
        post.image_filename
          ? `
            <img
              src="/uploads/${encodeURIComponent(post.image_filename)}"
              alt=""
              loading="lazy"
            >
          `
          : '';

      return `
        <article class="post-card">

          ${image}

          <div class="post-card-body">

            <div class="post-meta">
              ${formatDate(post.created_at)}
            </div>

            <h3>
              ${escapeHTML(post.title)}
            </h3>

            <p class="post-excerpt">
              ${escapeHTML(
                plainText(post.content_html)
              )}
            </p>

            <div class="post-actions">

              <a
                class="button button-primary"
                href="#/post/${encodeURIComponent(post.slug)}"
              >
                Читать
              </a>

              <button
                class="button button-secondary"
                onclick="copyPostLink('${escapeAttr(post.slug)}')"
              >
                Копировать ссылку
              </button>

            </div>

          </div>

        </article>
      `;
    }).join('');

  app.innerHTML = `
    <section class="container hero">

      <div class="eyebrow">
        Официальная площадка
      </div>

      <h1>
        V4nty | Бот
      </h1>

      <p>
        Публикации, обновления и важная информация
        проекта в одном месте.
      </p>

      <div class="hero-buttons">

        <a
          class="button button-primary"
          href="https://t.me/v4nty_bot"
          target="_blank"
          rel="noopener noreferrer"
        >
          Открыть бота
        </a>

        <a
          class="button button-secondary"
          href="https://t.me/v4nty_bot_channel"
          target="_blank"
          rel="noopener noreferrer"
        >
          Наш канал
        </a>

      </div>

    </section>

    <section class="container">

      <div class="section-title">

        <div>
          <div class="eyebrow">
            Публикации
          </div>

          <h2>
            Последнее
          </h2>
        </div>

        <div class="search">
          <input
            id="searchInput"
            type="search"
            placeholder="Поиск..."
            autocomplete="off"
          >
        </div>

      </div>

      <div id="posts">
        ${
          posts.length
            ? `<div class="posts">${cards}</div>`
            : `
              <div class="empty">
                Публикаций пока нет.
              </div>
            `
        }
      </div>

    </section>
  `;

  document
    .getElementById('searchInput')
    ?.addEventListener(
      'input',
      debounce(
        (event) =>
          searchPosts(
            event.target.value
          ),
        250
      )
    );
}

async function searchPosts(query) {
  try {
    const data =
      await api(
        `/api/posts?limit=100&q=${encodeURIComponent(query)}`
      );

    renderPostOnly(data.posts);
  } catch {
    toastMessage(
      'Не удалось выполнить поиск.'
    );
  }
}

function renderPostOnly(posts) {
  const container =
    document.getElementById('posts');

  if (!container) {
    return;
  }

  if (!posts.length) {
    container.innerHTML = `
      <div class="empty">
        Ничего не найдено.
      </div>
    `;

    return;
  }

  container.innerHTML = `
    <div class="posts">
      ${posts.map((post) => `
        <article class="post-card">

          ${
            post.image_filename
              ? `
                <img
                  src="/uploads/${encodeURIComponent(post.image_filename)}"
                  alt=""
                  loading="lazy"
                >
              `
              : ''
          }

          <div class="post-card-body">

            <div class="post-meta">
              ${formatDate(post.created_at)}
            </div>

            <h3>

function setupEditor() {
  const textarea =
    document.getElementById(
      'content'
    );

  const preview =
    document.getElementById(
      'preview'
    );

  document
    .querySelectorAll(
      '.toolbar button[data-before]'
    )
    .forEach((button) => {
      button.addEventListener(
        'click',
        () => {
          insertHTML(
            textarea,
            button.dataset.before,
            button.dataset.after
          );

          updatePreview();
        }
      );
    });

  document
    .getElementById('linkTool')
    ?.addEventListener(
      'click',
      () => {
        const url =
          prompt(
            'URL:',
            'https://'
          );

        if (!url) {
          return;
        }

        insertHTML(
          textarea,
          `<a href="${escapeAttr(url)}">`,
          `</a>`
        );

        updatePreview();
      }
    );

  textarea.addEventListener(
    'input',
    updatePreview
  );

  document
    .getElementById(
      'postForm'
    )
    .addEventListener(
      'submit',
      savePost
    );
}

function insertHTML(
  textarea,
  before,
  after
) {
  const start =
    textarea.selectionStart;

  const end =
    textarea.selectionEnd;

  const selected =
    textarea.value.slice(
      start,
      end
    );

  textarea.setRangeText(
    `${before}${selected || 'текст'}${after}`,
    start,
    end,
    'select'
  );

  textarea.focus();
}

let previewTimer = null;

function updatePreview() {
  clearTimeout(
    previewTimer
  );

  previewTimer =
    setTimeout(
      async () => {
        const textarea =
          document.getElementById(
            'content'
          );

        const preview =
          document.getElementById(
            'preview'
          );

        if (!textarea || !preview) {
          return;
        }

        try {
          const data =
            await api(
              '/api/preview',
              {
                method: 'POST',

                headers: {
                  'Content-Type':
                    'application/json'
                },

                body: JSON.stringify({
                  html:
                    textarea.value
                })
              }
            );

          preview.innerHTML =
            data.html ||
            'Введите текст...';
        } catch {
          preview.textContent =
            'Ошибка предпросмотра.';
        }
      },
      150
    );
}

async function login(event) {
  event.preventDefault();

  const loginValue =
    document.getElementById(
      'login'
    ).value;

  const passwordValue =
    document.getElementById(
      'password'
    ).value;

  try {
    await api(
      '/api/login',
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body: JSON.stringify({
          login: loginValue,
          password: passwordValue
        })
      }
    );

    siteData.isAdmin = true;

    const route =
      getRoute();

    adminTemplate(
      route.edit
        ? adminPosts.find(
            x =>
              Number(x.id) ===
              Number(route.edit)
          )
        : null
    );
  } catch (error) {
    const element =
      document.getElementById(
        'loginError'
      );

    element.textContent =
      error.message;

    element.classList.remove(
      'hidden'
    );
  }
}

async function logout() {
  try {
    await api(
      '/api/logout',
      {
        method: 'POST'
      }
    );
  } finally {
    siteData.isAdmin = false;

    location.hash =
      '#/admin';

    render();
  }

                onclick="editPost(${post.id})"

                Изменить

                href="#/post/${encodeURIComponent(post.slug)}"

                Открыть

function editPost(id) {
  const post =
    adminPosts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if (!post) {
    return;
  }

  location.hash =
    `#/admin?edit=${post.id}`;

  adminTemplate(post);
}

function newPost() {
  location.hash =
    '#/admin';

  adminTemplate();
}

async function deletePost(id) {
  const post =
    adminPosts.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if (!post) {
    return;
  }

  if (
    !confirm(
      `Удалить «${post.title}»?\n\nДействие нельзя отменить.`
    )
  ) {
    return;
  }

  try {
    await api(
      `/api/admin/posts/${id}`,
      {
        method: 'DELETE'
      }
    );

    toastMessage(
      'Пост удалён.'
    );

    newPost();
  } catch (error) {
    toastMessage(
      error.message
    );
  }
}

async function savePost(event) {
  event.preventDefault();

  const errorElement =
    document.getElementById(
      'formError'
    );

  errorElement.classList.add(
    'hidden'
  );

  const id =
    document.getElementById(
      'postId'
    ).value;

  const formData =
    new FormData();

  formData.append(
    'title',
    document.getElementById(
      'postTitle'
    ).value.trim()
  );

  formData.append(
    'contentHtml',
    document.getElementById(
      'content'
    ).value
  );

  formData.append(
    'imageCaption',
    document.getElementById(
      'caption'
    ).value.trim()
  );

  formData.append(
    'published',
    document.getElementById(
      'published'
    ).checked
      ? '1'
      : '0'
  );

  const removeImage =
    document.getElementById(
      'removeImage'
    );

  formData.append(
    'removeImage',
    removeImage?.checked
      ? '1'
      : '0'
  );

  const file =
    document.getElementById(
      'image'
    ).files[0];

  if (file) {
    formData.append(
      'image',
      file
    );
  }

  try {
    const data =
      await api(
        id
          ? `/api/admin/posts/${id}`
          : '/api/admin/posts',
        {
          method:
            id
              ? 'PUT'
              : 'POST',

          body: formData
        }
      );

    toastMessage(
      'Пост сохранён.'
    );

    location.hash =
      `#/post/${encodeURIComponent(
        data.post.slug
      )}`;

    await renderPost(
      data.post.slug
    );
  } catch (error) {
    errorElement.textContent =
      error.message;

    errorElement.classList.remove(
      'hidden'
    );
  }
}

function getAdminRoute() {
  const hash =
    location.hash || '';

  if (!hash.startsWith(
    '#/admin'
  )) {
    return {
      edit: null
    };
  }

  const queryStart =
    hash.indexOf('?');

  if (
    queryStart === -1
  ) {
    return {
      edit: null
    };
  }

  const query =
    hash.slice(
      queryStart + 1
    );

  const params =
    new URLSearchParams(
      query
    );

  return {
    edit:
      params.get('edit')
  };
}

async function renderAdmin() {
  await loadSite();

  if (!siteData.isAdmin) {
    renderAdminLogin();
    return;
  }

  const route =
    getAdminRoute();

  if (!adminPosts.length) {
    try {
      const data =
        await api(
          '/api/posts?limit=100'
        );

      adminPosts =
        data.posts;
    } catch {}
  }

  const post =
    route.edit
      ? adminPosts.find(
          item =>
            Number(item.id) ===
            Number(route.edit)
        )
      : null;

  adminTemplate(
    post || null
  );
}

async function render() {
  const route =
    getRoute();

  document.title =
    'V4nty | Бот';

  if (route.type === 'home') {
    await renderHomePage();
    return;
  }

  if (route.type === 'post') {
    await loadSite();
    await renderPost(
      route.slug
    );
    return;
  }

  if (route.type === 'admin') {
    await renderAdmin();
  }
}

async function copyPostLink(slug) {
  const url =
    `${location.origin}${location.pathname}#/post/${encodeURIComponent(slug)}`;

  await copyText(url);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(
      text
    );

    toastMessage(
      'Ссылка скопирована.'
    );
  } catch {
    toastMessage(
      'Не удалось скопировать ссылку.'
    );
  }
}

function debounce(
  callback,
  delay
) {
  let timer;

  return (...args) => {
    clearTimeout(timer);

    timer =
      setTimeout(
        () => callback(...args),
        delay
      );
  };
}

window.addEventListener(
  'hashchange',
  render
);

render();
</script>
