name: Deploy V4nty Worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute v4nty-db --remote --file=schema.sql

      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_LOGIN: ${{ secrets.ADMIN_LOGIN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          V4NTY_GITHUB_TOKEN: ${{ secrets.V4NTY_GITHUB_TOKEN }}
        run: |
          printf '%s' "$ADMIN_LOGIN" | wrangler secret put ADMIN_LOGIN
          printf '%s' "$ADMIN_PASSWORD" | wrangler secret put ADMIN_PASSWORD
          printf '%s' "$SESSION_SECRET" | wrangler secret put SESSION_SECRET
          printf '%s' "$V4NTY_GITHUB_TOKEN" | wrangler secret put GITHUB_TOKEN

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
